# Release por tag: `git tag v1.2.3 && git push origin v1.2.3` compila o binário
# para cada plataforma, empacota com README e LICENSE, gera o SHA-256 e publica
# tudo numa GitHub Release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: binário estático, roda em qualquer distribuição Linux.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="dupfind-${GITHUB_REF_NAME}-${TARGET}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/dupfind.exe" "$name/"
            archive="$name.zip"
            7z a "$archive" "$name" > /dev/null
          else
            cp "target/$TARGET/release/dupfind" "$name/"
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          # O macOS não tem sha256sum; o shasum gera o mesmo formato.
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dupfind-*.tar.gz
            dupfind-*.zip
            dupfind-*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "dupfind $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
